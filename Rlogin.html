 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب - RedToot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header id="header" role="banner"></header>

    <main class="page-content">
        <div class="container">
            <div class="form-container">
                <div class="tabs">
                    <button class="tab active" id="login-tab">تسجيل الدخول</button>
                    <button class="tab" id="register-tab">إنشاء حساب</button>
                </div>

                <!-- Alerts -->
                <div id="alert-success" class="alert alert-success" style="display:none"></div>
                <div id="alert-error" class="alert alert-error" style="display:none"></div>
                <div id="loading" class="loading" style="display:none"><i class="fas fa-spinner fa-spin"></i> جاري المعالجة...</div>

                <!-- Login Form -->
                <form id="loginForm" class="form-section" style="display:block;">
                    <h2 class="form-title">تسجيل الدخول</h2>

                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <div class="form-options">
                        <div>
                            <input type="checkbox" id="remember">
                            <label for="remember">تذكرني</label>
                        </div>
                        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="btn" id="login-btn"><span class="btn-text">تسجيل الدخول</span></button>

                    <div class="divider"><span>أو</span></div>

                    <button id="google-login" class="btn btn-google"><span class="btn-text"><div class="google-icon">G</div> تسجيل الدخول باستخدام جوجل</span></button>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="form-section" style="display:none;">
                    <h2 class="form-title">إنشاء حساب جديد</h2>

                    <div class="form-group">
                        <label>اسم المستخدم</label>
                        <input type="text" id="reg-username" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="reg-email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="reg-password" class="form-control" required>
                        <small style="color:gray;font-size:0.8rem;">كلمة المرور يجب أن تكون 6 أحرف على الأقل</small>
                    </div>

                    <div class="form-group">
                        <label>تأكيد كلمة المرور</label>
                        <input type="password" id="reg-confirm-password" class="form-control" required>
                    </div>

                    <div>
                        <input type="checkbox" id="agree-terms" required>
                        <label for="agree-terms">أوافق على <a href="terms.html">شروط الاستخدام</a> و <a href="privacy.html">سياسة الخصوصية</a></label>
                    </div>

                    <button type="submit" class="btn" id="register-btn"><span class="btn-text">إنشاء حساب</span></button>

                    <div class="divider"><span>أو</span></div>

                    <button id="google-register" class="btn btn-google"><span class="btn-text"><div class="google-icon">G</div> التسجيل باستخدام جوجل</span></button>
                </form>
            </div>
        </div>
    </main>


    <!-- Footer -->
    <footer id="footer" role="contentinfo"></footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>


    <!-- Core Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
    <script src="js/headerfooter.js"></script>
    <!-- <script src="js/force-hard-refresh.js"></script> -->



    <script>
        // Tabs
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        loginTab.onclick = () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        };

        registerTab.onclick = () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        };

        function showAlert(msg, type) {
            const el = document.getElementById(`alert-${type}`);
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        function toggleLoading(v) {
            document.getElementById('loading').style.display = v ? 'block' : 'none';
        }

        function setBtn(btn, loading, text) {
            btn.disabled = loading;
            btn.querySelector('.btn-text').innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i> ...' : text;
        }

        // Login
        loginForm.addEventListener('submit', async(e)=>{
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const btn = document.getElementById('login-btn');

            toggleLoading(true); setBtn(btn,true,'');

            try{
                await auth.setPersistence(remember? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
                await auth.signInWithEmailAndPassword(email,pass);
                showAlert('تم تسجيل الدخول بنجاح','success');
                setTimeout(()=> location.href='index.html',1500);
            }catch(err){ showAlert('خطأ في تسجيل الدخول','error'); }
            finally{ toggleLoading(false); setBtn(btn,false,'تسجيل الدخول'); }
        });

        // Register
        registerForm.addEventListener('submit', async(e)=>{
            e.preventDefault();
            const u = document.getElementById('reg-username').value;
            const e1 = document.getElementById('reg-email').value;
            const p1 = document.getElementById('reg-password').value;
            const p2 = document.getElementById('reg-confirm-password').value;
            const btn = document.getElementById('register-btn');

            if(p1 !== p2) return showAlert('كلمات المرور غير متطابقة','error');
            if(p1.length < 6) return showAlert('كلمة المرور قصيرة جداً','error');

            toggleLoading(true); setBtn(btn,true,'');

            try{
                const cred = await auth.createUserWithEmailAndPassword(e1,p1);
                await cred.user.updateProfile({displayName:u});
                await cred.user.sendEmailVerification();
                showAlert('تم إنشاء الحساب وإرسال رابط التحقق','success');
                setTimeout(()=> location.href='index.html',2000);
            }catch(err){ showAlert('خطأ أثناء إنشاء الحساب','error'); }
            finally{ toggleLoading(false); setBtn(btn,false,'إنشاء حساب'); }
        });

        // Google
        function googleSign(btn){
            setBtn(btn,true,'');
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(()=>{ showAlert('تم تسجيل الدخول بنجاح','success'); setTimeout(()=>location.href='index.html',1500); })
                .catch(()=> showAlert('خطأ أثناء التسجيل باستخدام جوجل','error'))
                .finally(()=> setBtn(btn,false, btn.id==='google-login'?'تسجيل الدخول باستخدام جوجل':'التسجيل باستخدام جوجل'));
        }

        document.getElementById('google-login').onclick = function(){ googleSign(this); };
        document.getElementById('google-register').onclick = function(){ googleSign(this); };

        auth.onAuthStateChanged(user=>{ if(user) location.href='index.html'; });
    </script>
</body>
</html>
