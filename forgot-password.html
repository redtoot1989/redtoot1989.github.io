<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e53935">
    <link rel="manifest" href="manifest.json">
    <title>استعادة كلمة المرور - RedToot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header" role="banner"></header>
    <main class="page-content">
        <section class="container form-container">
            <h1 class="form-title">استعادة كلمة المرور</h1>
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="reset-email">البريد الإلكتروني</label>
                    <input id="reset-email" class="form-control" type="email" required>
                </div>
                <button class="btn" type="submit">إرسال رابط الاستعادة</button>
            </form>
        </section>
    </main>
    <footer id="footer" role="contentinfo"></footer>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/headerfooter.js"></script>
    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            await auth.sendPasswordResetEmail(email);
            alert('تم إرسال رابط استعادة كلمة المرور إن كان البريد مسجلا.');
        });
    </script>
</body>
</html>
