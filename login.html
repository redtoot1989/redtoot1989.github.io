 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - RedToot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header id="header" role="banner"></header>



    <main class="page-content">
        <div class="container">
            <div class="form-container">
                <h2 class="form-title">تسجيل الدخول</h2>
                
                <!-- Alert Messages -->
                <div id="alert-success" class="alert alert-success" style="display: none;"></div>
                <div id="alert-error" class="alert alert-error" style="display: none;"></div>
                
                <!-- Loading Indicator -->
                <div id="loading" class="loading" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i> جاري المعالجة...
                </div>
                
                <!-- Google Login Button -->
                <button id="google-signin" class="btn btn-google">
                    <span class="btn-text">
                        <div class="google-icon">G</div>
                        تسجيل الدخول بحساب جوجل
                    </span>
                </button>
                
                <div class="divider">
                    <span>أو</span>
                </div>
                
                <!-- Regular Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" class="form-control" placeholder="أدخل بريدك الإلكتروني" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                    </div>
                    
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">تذكرني</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-password">نسيت كلمة المرور؟</a>
                    </div>
                    
                    <button type="submit" class="btn" style="width: 100%;" id="login-btn">
                        <span class="btn-text">تسجيل الدخول</span>
                    </button>
                    
                    <div class="form-footer">
                        <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    
    
    <!-- Footer -->
    <footer id="footer" role="contentinfo"></footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    
    
        
    <!-- Core Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
    <script src="js/headerfooter.js"></script>
    <!-- <script src="js/force-hard-refresh.js"></script> -->
    
    
    
    
    
    
    
    <script>
        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const rememberMe = document.getElementById('remember').checked;
            
            // Show loading
            toggleLoading(true);
            setButtonLoading(loginBtn, true);
            
            try {
                // Set persistence based on remember me
                const persistence = rememberMe ? 
                    firebase.auth.Auth.Persistence.LOCAL : 
                    firebase.auth.Auth.Persistence.SESSION;
                
                await auth.setPersistence(persistence);
                
                // Sign in user
                await auth.signInWithEmailAndPassword(email, password);
                
                showAlert('تم تسجيل الدخول بنجاح!', 'success');
                
                // Redirect to home page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                
            } catch (error) {
                let errorMessage = 'حدث خطأ أثناء تسجيل الدخول';
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'البريد الإلكتروني غير مسجل';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'كلمة المرور غير صحيحة';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'البريد الإلكتروني غير صالح';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessage = 'هذا الحساب معطل';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = 'خطأ في الشبكة، يرجى المحاولة مرة أخرى';
                }
                
                showAlert(errorMessage, 'error');
                console.error('Login error:', error);
            } finally {
                toggleLoading(false);
                setButtonLoading(loginBtn, false);
            }
        });

        // Google Sign In
        document.getElementById('google-signin').addEventListener('click', function() {
            const googleBtn = this;
            setButtonLoading(googleBtn, true);
            
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('profile');
            provider.addScope('email');
            
            auth.signInWithPopup(provider)
                .then((result) => {
                    showAlert('تم تسجيل الدخول بنجاح!', 'success');
                    
                    // Redirect to home page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                })
                .catch((error) => {
                    let errorMessage = 'حدث خطأ أثناء تسجيل الدخول باستخدام جوجل';
                    
                    if (error.code === 'auth/popup-closed-by-user') {
                        errorMessage = 'تم إغلاق نافذة التسجيل';
                    } else if (error.code === 'auth/popup-blocked') {
                        errorMessage = 'تم حظر النافذة المنبثقة، يرجى السماح بالنوافذ المنبثقة لهذا الموقع';
                    }
                    
                    showAlert(errorMessage, 'error');
                    console.error('Google sign-in error:', error);
                })
                .finally(() => {
                    setButtonLoading(googleBtn, false);
                });
        });

        // Utility functions
        function showAlert(message, type) {
            const alertDiv = document.getElementById(`alert-${type}`);
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        function toggleLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function setButtonLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.style.opacity = '0.7';
                button.querySelector('.btn-text').innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...';
            } else {
                button.disabled = false;
                button.style.opacity = '1';
                button.querySelector('.btn-text').textContent = loading ? 'جاري المعالجة...' : 'تسجيل الدخول';
            }
        }

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is already logged in, redirect to home
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
