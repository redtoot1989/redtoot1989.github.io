 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e53935">
    <link rel="manifest" href="manifest.json">
    <title>جميع الحسابات - RedToot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header id="header" role="banner"></header>

    <main class="page-content">
        <div class="container">
            <div class="section-title">
                <h2>جميع الحسابات</h2>
                <p>اكتشف آلاف الحسابات عبر مختلف منصات التواصل الاجتماعي</p>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-container">
                    <div class="filter-title">
                        <i class="fas fa-filter"></i>
                        تصفية حسب المنصة
                    </div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">
                            <i class="fas fa-globe"></i>
                            الكل
                        </button>
                        <button class="filter-btn instagram" data-filter="instagram">
                            <i class="fab fa-instagram"></i>
                            انستغرام
                        </button>
                        <button class="filter-btn snapchat" data-filter="snapchat">
                            <i class="fab fa-snapchat-ghost"></i>
                            سناب شات
                        </button>
                        <button class="filter-btn tiktok" data-filter="tiktok">
                            <i class="fab fa-tiktok"></i>
                            تيك توك
                        </button>
                        <button class="filter-btn facebook" data-filter="facebook">
                            <i class="fab fa-facebook-f"></i>
                            فيسبوك
                        </button>
                        <button class="filter-btn twitter" data-filter="twitter">
                            <i class="fab fa-twitter"></i>
                            تويتر
                        </button>
                        <button class="filter-btn youtube" data-filter="youtube">
                            <i class="fab fa-youtube"></i>
                            يوتيوب
                        </button>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="ابحث عن حساب...">
                    </div>
                </div>
            </div>

            <!-- Results Counter -->
            <div class="results-counter">
                <span id="resultsCount">0</span> حساب معروض
            </div>

            <!-- Cards Container -->
            <div class="cards-container" id="profiles-container">
                <!-- Profiles will be loaded dynamically -->
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> جاري تحميل الحسابات...
                </div>
            </div>

            <!-- Load More Button -->
            <div class="form-actions" id="load-more-container" style="display: none;">
                <button id="load-more-btn" class="btn btn-secondary">
                    <i class="fas fa-redo"></i>
                    تحميل المزيد
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer" role="contentinfo"></footer>
    
    
    

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Core Scripts -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/AdvancedInputValidator.js"></script>
    <script src="js/AuthManager.js"></script>
    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
    <script src="js/headerfooter.js"></script>
    <!-- <script src="js/force-hard-refresh.js"></script> -->
    <script src="js/AdminPanel.js"></script>
    
    
    <script>
        let currentFilter = 'all';
        let currentSearch = '';
        let lastVisible = null;
        let hasMoreProfiles = true;
        let isLoadingProfiles = false;
        let infiniteObserver = null;
        const pageSize = 12;

        // Load initial profiles
        document.addEventListener('DOMContentLoaded', async function() {
            await waitForDatabase();
            bindListingEvents();
            await loadProfiles();
            
            // Check URL parameters for platform filter
            const urlParams = new URLSearchParams(window.location.search);
            const platform = urlParams.get('platform');
            if (platform) {
                filterProfiles(platform);
            }

            infiniteObserver = redTootApp.setupInfiniteScroll('profiles-container', loadMoreProfiles);
        });

        function waitForDatabase() {
            if (window.dbManager) return Promise.resolve();
            return new Promise(resolve => window.addEventListener('databaseReady', resolve, { once: true }));
        }

        function bindListingEvents() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => filterProfiles(btn.dataset.filter || 'all'));
            });
            document.getElementById('searchInput')?.addEventListener('input', () => searchProfiles());
            document.getElementById('load-more-btn')?.addEventListener('click', () => loadMoreProfiles());
        }

        async function loadProfiles() {
            lastVisible = null;
            hasMoreProfiles = true;
            try {
                if (currentSearch.trim()) {
                    const filters = currentFilter !== 'all' ? { platform: currentFilter } : {};
                    const profiles = await dbManager.searchProfiles(currentSearch, filters);
                    displayProfiles(profiles);
                    updateResultsCount(profiles.length);
                    updateLoadMore(false);
                    return;
                }

                const result = await fetchProfilesPage();
                displayProfiles(result.profiles);
                updateResultsCount(result.profiles.length);
                updateLoadMore(result.hasMore);
            } catch (error) {
                showError('حدث خطأ في تحميل الحسابات');
            }
        }

        async function loadMoreProfiles() {
            if (currentSearch.trim() || !hasMoreProfiles || isLoadingProfiles) return false;
            try {
                const result = await fetchProfilesPage(lastVisible);
                appendProfiles(result.profiles);
                updateResultsCount(document.querySelectorAll('#profiles-container .profile-card').length);
                updateLoadMore(result.hasMore);
                return result.hasMore;
            } catch (error) {
                showError('حدث خطأ في تحميل المزيد من الحسابات');
                return false;
            }
        }

        async function fetchProfilesPage(cursor = null) {
            isLoadingProfiles = true;
            const filters = { status: 'approved' };
            if (currentFilter !== 'all') filters.platform = currentFilter;

            try {
                const result = await dbManager.getProfiles(filters, { limit: pageSize, cursor });
                lastVisible = result.nextCursor;
                hasMoreProfiles = result.hasMore;
                return { profiles: result.profiles, hasMore: result.hasMore };
            } finally {
                isLoadingProfiles = false;
            }
        }

        function displayProfiles(profiles) {
            const container = document.getElementById('profiles-container');
            
            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="no-results" style="text-align: center; padding: 40px; color: var(--gray); grid-column: 1 / -1;">
                        <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <h3>لا توجد نتائج</h3>
                        <p>${currentSearch ? 'لم نتمكن من العثور على أي حسابات تطابق معايير البحث' : 'لا توجد حسابات متاحة حالياً'}</p>
                        ${!currentSearch ? '<a href="add-profile.html" class="btn" style="margin-top: 20px;">كن أول من ينشر حساب</a>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = profiles.map(profile => 
                redTootApp.createProfileCard(profile)
            ).join('');
        }

        function appendProfiles(profiles) {
            const container = document.getElementById('profiles-container');
            if (!profiles.length) return;
            container.insertAdjacentHTML('beforeend', profiles.map(profile =>
                redTootApp.createProfileCard(profile)
            ).join(''));
        }

        function updateLoadMore(hasMore) {
            const loadMoreContainer = document.getElementById('load-more-container');
            hasMoreProfiles = hasMore;
            loadMoreContainer.style.display = hasMore ? 'block' : 'none';
            if (!hasMore) document.getElementById('profiles-container-sentinel')?.remove();
            if (hasMore && !document.getElementById('profiles-container-sentinel')) {
                infiniteObserver = redTootApp.setupInfiniteScroll('profiles-container', loadMoreProfiles);
            }
        }

        function updateResultsCount(count) {
            document.getElementById('resultsCount').textContent = count;
        }

        function filterProfiles(filter) {
            currentFilter = filter;
            
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const active = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
            if (active) active.classList.add('active');
            const url = new URL(window.location.href);
            if (filter === 'all') url.searchParams.delete('platform');
            else url.searchParams.set('platform', filter);
            window.history.replaceState({}, '', url);
            loadProfiles();
        }

        function searchProfiles() {
            currentSearch = document.getElementById('searchInput').value;
            loadProfiles();
        }

        function showError(message) {
            const container = document.getElementById('profiles-container');
            container.innerHTML = `
                <div class="no-results" style="text-align: center; padding: 40px; color: var(--gray); grid-column: 1 / -1;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 20px;"></i>
                    <h3>حدث خطأ</h3>
                    <p>${message}</p>
                    <button class="btn" type="button" id="retry-load-profiles" style="margin-top: 20px;">
                        <i class="fas fa-redo"></i> إعادة المحاولة
                    </button>
                </div>
            `;
            document.getElementById('retry-load-profiles')?.addEventListener('click', () => loadProfiles());
        }
    </script>
</body>
</html>
