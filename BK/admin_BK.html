<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - RedToot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!--#include file="header.html" -->
    
    <main class="page-content">
        <div class="container">
            <div class="section-title">
                <h2><i class="fas fa-cog"></i> لوحة التحكم</h2>
                <p>إدارة المحتوى والمستخدمين والإحصائيات</p>
            </div>

            <!-- Statistics -->
            <div class="admin-stats">
                <div class="stat-card">
                    <span class="stat-number" id="total-users">0</span>
                    <span class="stat-label">المستخدمين</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="total-profiles">0</span>
                    <span class="stat-label">الحسابات</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="pending-profiles">0</span>
                    <span class="stat-label">بانتظار الموافقة</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="vip-users">0</span>
                    <span class="stat-label">مشتركين VIP</span>
                </div>
            </div>

            <!-- Pending Profiles -->
            <div class="admin-panel">
                <h3><i class="fas fa-clock"></i> الحسابات المنتظرة الموافقة</h3>
                <div class="admin-table">
                    <table id="pending-profiles-table">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>المنصة</th>
                                <th>المستخدم</th>
                                <th>التاريخ</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="pending-profiles-body">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Recent Users -->
            <div class="admin-panel">
                <h3><i class="fas fa-users"></i> أحدث المستخدمين</h3>
                <div class="admin-table">
                    <table id="recent-users-table">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>البريد</th>
                                <th>الحالة</th>
                                <th>التاريخ</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="recent-users-body">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Reports -->
            <div class="admin-panel">
                <h3><i class="fas fa-flag"></i> البلاغات</h3>
                <div class="admin-table">
                    <table id="reports-table">
                        <thead>
                            <tr>
                                <th>المبلغ</th>
                                <th>الحساب</th>
                                <th>السبب</th>
                                <th>التاريخ</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="reports-body">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!--#include file="footer.html" -->
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
